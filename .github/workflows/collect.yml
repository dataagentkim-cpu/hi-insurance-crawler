name: 현대해상 보험료 수집

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 수집 실행
        run: python3 hi_collect.py

      - name: Excel 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hi-insurance-excel
          path: hi_보험료_*.xlsx
          retention-days: 30
